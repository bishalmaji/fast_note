name: fast_note
description: "A fast modern note-taking app with Hive"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Icons
  iconsax: ^0.0.8
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  
  # Utils
  uuid: ^4.5.2
  intl: ^0.20.2
  url_launcher: ^6.3.2

  #state
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter_native_splash:
  color: "#000000"
  image: assets/images/app_logo_gp.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/app_logo_gp.png


